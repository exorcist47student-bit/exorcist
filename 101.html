<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>101 Game v12</title>
    <style>
        :root {
            --bg: #000000; --card: #1c1c1e; --text: #ffffff; --sub: #8e8e93;
            --accent: #0a84ff; --danger: #ff453a; --success: #30d158; 
            --warn: #ffd60a; --heart: #ff375f; --border: #333333;
            --modal-bg: rgba(28, 28, 30, 0.95);
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f2f2f7; --card: #ffffff; --text: #000000; --sub: #636366;
                --accent: #007aff; --danger: #ff3b30; --success: #34c759; 
                --warn: #ffcc00; --heart: #ff2d55; --border: #e5e5ea;
                --modal-bg: rgba(255, 255, 255, 0.95);
            }
        }

        body { 
            background: var(--bg); color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; 
            padding: 20px; margin: 0; padding-bottom: 100px; transition: background 0.3s, color 0.3s;
        }
        
        .stats-bar { display: flex; justify-content: space-between; margin-bottom: 25px; gap: 10px; }
        .stat-box { 
            flex: 1; background: var(--card); padding: 10px; border-radius: 16px; 
            text-align: center; border: 1px solid var(--border); 
        }
        .stat-label { color: var(--sub); font-size: 11px; text-transform: uppercase; display: block; margin-bottom: 4px; letter-spacing: 0.5px; }
        .stat-val { font-size: 20px; font-weight: 700; }
        
        /* Setup Area with Autocomplete */
        .setup-area { position: relative; margin-bottom: 25px; z-index: 70; }
        .input-wrapper { display: flex; gap: 10px; }
        input[type="text"] { 
            flex: 1; background: var(--card); border: 1px solid var(--border); padding: 14px; 
            border-radius: 12px; color: var(--text); font-size: 16px; outline: none; width: 100%; box-sizing: border-box;
        }
        .btn-add { background: var(--accent); color: white; padding: 0 24px; border-radius: 12px; font-size: 20px; border:none; }
        
        /* Autocomplete Dropdown */
        .autocomplete-list {
            position: absolute; top: 100%; left: 0; right: 50px;
            background: var(--card); border: 1px solid var(--border); border-radius: 12px;
            margin-top: 5px; max-height: 200px; overflow-y: auto;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); display: none;
        }
        .autocomplete-item {
            padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
        }
        .autocomplete-item:last-child { border-bottom: none; }
        .autocomplete-item:active { background: var(--accent); color: white; }
        .ac-name { font-weight: 500; }

        .player-card { 
            background: var(--card); padding: 16px; border-radius: 16px; 
            margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; 
            border: 1px solid var(--border);
        }
        .p-info { flex: 1; }
        .p-name { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
        .p-stats { display: flex; gap: 12px; align-items: baseline; }
        .score-val { color: var(--accent); font-weight: 800; font-size: 22px; }
        .score-rem { color: var(--sub); font-size: 15px; font-weight: 500; }
        
        button { border: none; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.1s; -webkit-tap-highlight-color: transparent; }
        button:active { transform: scale(0.92); opacity: 0.8; }
        
        .actions { display: flex; gap: 6px; align-items: center; }
        .btn-action { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 22px; border-radius: 50%; }
        .btn-plus { background: var(--success); color: black; }
        .btn-minus { background: var(--warn); color: black; }
        .btn-calc { background: var(--card); color: var(--text); border: 1px solid var(--border); font-size: 20px; }
        .btn-del { background: transparent; color: var(--danger); font-size: 24px; width: 40px; }

        .modal-overlay { 
            position: fixed; top:0; left:0; right:0; bottom:0; 
            background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; 
            z-index: 100; backdrop-filter: blur(8px); 
        }
        .modal { 
            background: var(--card); padding: 30px 25px; border-radius: 24px; 
            width: 85%; max-width: 340px; text-align: center; border: 1px solid var(--border);
        }
        .modal h3 { margin: 0 0 15px 0; color: var(--sub); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        .modal input { 
            width: 100%; margin: 10px 0 25px 0; text-align: center; 
            font-size: 48px; font-weight: bold; background: var(--bg); 
            border: 1px solid var(--border); border-radius: 16px; padding: 15px 0;
            color: var(--text); outline: none; -moz-appearance: textfield;
        }
        .modal input::-webkit-outer-spin-button, .modal input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .modal-btns { display: flex; gap: 12px; justify-content: center; }
        .modal-btns button { flex: 1; padding: 16px; font-size: 17px; border-radius: 14px; }
        .btn-cancel { background: var(--border); color: var(--text); }
        .btn-ok { background: var(--accent); color: white; }

        .toast { 
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px); 
            background: var(--danger); color: white; padding: 14px 28px; border-radius: 30px; 
            font-weight: 700; box-shadow: 0 5px 15px rgba(0,0,0,0.2); 
            opacity: 0; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            pointer-events: none; z-index: 200; white-space: nowrap; 
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { background: var(--success); color: black; }

        .bottom-panel { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: var(--modal-bg); backdrop-filter: blur(20px); 
            padding: 15px 20px 35px 20px; display: flex; gap: 12px; 
            border-top: 1px solid var(--border); z-index: 50; 
        }
        .btn-round { flex: 2; background: var(--accent); color: white; padding: 16px; font-size: 17px; border-radius: 14px; }
        .btn-reset { flex: 0.6; background: var(--card); color: var(--danger); padding: 16px; border-radius: 14px; border: 1px solid var(--border); }
        .btn-stats { flex: 0.6; background: var(--card); color: var(--text); padding: 16px; border-radius: 14px; border: 1px solid var(--border); font-size: 20px; }

        /* STATS SHEET STYLES */
        .stats-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 140;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .stats-overlay.visible { opacity: 1; pointer-events: auto; }

        .stats-sheet {
            position: fixed; bottom: 0; left: 0; right: 0; top: 35%;
            background: var(--modal-bg); backdrop-filter: blur(25px);
            border-radius: 24px 24px 0 0; transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
            z-index: 150; display: flex; flex-direction: column;
            border-top: 1px solid var(--border); border-bottom: none;
            will-change: transform;
        }
        .stats-sheet.open { transform: translateY(0); }
        
        .sheet-handle-area { 
            width: 100%; height: 30px; display: flex; align-items: center; 
            justify-content: center; cursor: grab; touch-action: none; 
        }
        .sheet-handle { width: 40px; height: 5px; background: var(--sub); border-radius: 3px; opacity: 0.5; }
        
        .close-stats { 
            position: absolute; top: 10px; right: 10px; 
            width: 44px; height: 44px; border-radius: 50%; 
            background: var(--card); border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center; 
            color: var(--sub); font-size: 20px; z-index: 160;
            -webkit-tap-highlight-color: transparent;
        }
        .close-stats:active { background: var(--border); }

        .sheet-tabs { display: flex; padding: 0 20px; gap: 10px; margin-bottom: 15px; margin-top: 10px;}
        .tab { 
            flex: 1; padding: 10px; text-align: center; border-radius: 10px; 
            background: var(--card); color: var(--sub); font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .tab.active { background: var(--accent); color: white; }
        .date-selector { 
            display: flex; overflow-x: auto; padding: 0 20px 15px 20px; gap: 8px; 
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .date-selector::-webkit-scrollbar { display: none; }
        .date-chip { 
            padding: 8px 16px; border-radius: 20px; background: var(--card); 
            color: var(--sub); font-size: 13px; white-space: nowrap; border: 1px solid var(--border);
        }
        .date-chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }
        .stats-list { flex: 1; overflow-y: auto; padding: 0 20px 20px 20px; }
        .stat-row { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 14px 0; border-bottom: 1px solid var(--border); 
        }
        .stat-row:last-child { border-bottom: none; }
        .rank { width: 30px; font-weight: 700; color: var(--sub); }
        .rank.top-1 { color: #ffd700; } .rank.top-2 { color: #c0c0c0; } .rank.top-3 { color: #cd7f32; }
        .s-name { flex: 1; font-weight: 500; padding-left: 10px; }
        .s-val { font-weight: 700; font-size: 18px; }

        /* CALCULATOR MODAL STYLES */
        .calc-modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg); z-index: 300;
            display: none; flex-direction: column; padding: 20px;
            transform: translateY(100%); transition: transform 0.3s ease;
        }
        .calc-modal.open { display: flex; transform: translateY(0); }
        
        .calc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .calc-title { font-size: 18px; font-weight: 700; }
        .calc-close { width: 36px; height: 36px; border-radius: 50%; background: var(--card); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--sub); }
        
        .calc-total-area { text-align: center; margin-bottom: 20px; }
        .calc-total-label { font-size: 12px; color: var(--sub); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .calc-total-value { font-size: 64px; font-weight: 800; line-height: 1; transition: transform 0.1s; }
        .calc-total-value.bump { transform: scale(1.1); }

        .calc-grid { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; 
            flex: 1; align-content: start; max-width: 500px; margin: 0 auto; width: 100%;
        }
        .calc-btn {
            background: var(--card); border: 1px solid var(--border); border-radius: 14px;
            height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.1s; position: relative;
            -webkit-tap-highlight-color: transparent;
        }
        .calc-btn:active { transform: scale(0.95); background: var(--border); }
        .calc-btn.disabled { opacity: 0.3; pointer-events: none; filter: grayscale(0.8); }
        .calc-btn.shake { animation: shake 0.3s ease-in-out; }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        .calc-val { font-size: 24px; font-weight: 700; margin-bottom: 2px; }
        .calc-desc { font-size: 11px; color: var(--sub); }
        .calc-count { 
            position: absolute; top: 6px; right: 8px; 
            font-size: 11px; font-weight: 600; color: var(--sub); opacity: 0;
            transition: opacity 0.2s;
        }
        .calc-count.visible { opacity: 1; }
        
        .calc-btn-q.solo .calc-count { color: var(--warn); opacity: 1; }
        .calc-btn-qh.solo .calc-count { color: var(--heart); opacity: 1; }
        .calc-btn-qh .calc-val { color: var(--heart); }

        .calc-controls { 
            display: flex; gap: 12px; margin-top: auto; padding-top: 20px; 
            max-width: 500px; width: 100%; margin-left: auto; margin-right: auto;
        }
        .calc-ctrl { 
            flex: 1; padding: 16px; border-radius: 14px; border: none; 
            font-size: 16px; font-weight: 600; cursor: pointer; 
            -webkit-tap-highlight-color: transparent;
        }
        .calc-reset { background: var(--card); color: var(--danger); border: 1px solid var(--border); }
        .calc-apply { background: var(--accent); color: white; }
    </style>
</head>
<body>

    <div class="stats-bar">
        <div class="stat-box"><span class="stat-label">Игра</span><span class="stat-val" id="gameNum">1</span></div>
        <div class="stat-box"><span class="stat-label">Раунд</span><span class="stat-val" id="roundNum">1</span></div>
    </div>

    <!-- Setup with Autocomplete -->
    <div class="setup-area">
        <div class="input-wrapper">
            <input type="text" id="nameInput" placeholder="Имя игрока..." autocomplete="off">
            <button class="btn-add" onclick="addPlayerFromInput()">+</button>
        </div>
        <div id="autocompleteList" class="autocomplete-list"></div>
    </div>

    <div id="gameArea"></div>

    <!-- Score Input Modal -->
    <div id="scoreModal" class="modal-overlay">
        <div class="modal">
            <h3 id="modalTitle">Очки</h3>
            <input type="number" id="scoreInput" inputmode="decimal">
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModal()">Отмена</button>
                <button class="btn-ok" onclick="confirmScore()">OK</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Уведомление</div>
    
    <div class="bottom-panel">
        <button class="btn-stats" onclick="openStats()">📊</button>
        <button class="btn-reset" onclick="fullReset()">Сброс</button>
        <button class="btn-round" onclick="endRound()">Завершить раунд</button>
    </div>

    <!-- Overlay for stats tap -->
    <div id="statsOverlay" class="stats-overlay" onclick="closeStats()"></div>

    <!-- Stats Sheet -->
    <div id="statsSheet" class="stats-sheet">
        <div class="sheet-handle-area" id="swipeArea">
            <div class="sheet-handle"></div>
        </div>
        <div class="close-stats" onclick="closeStats()">✕</div>
        
        <div class="sheet-tabs">
            <div class="tab active" onclick="switchTab('points')">Очки</div>
            <div class="tab" onclick="switchTab('wins')">Победы</div>
        </div>
        <div class="date-selector" id="dateSelector"></div>
        <div class="stats-list" id="statsList"></div>
    </div>

    <!-- INTEGRATED CALCULATOR MODAL -->
    <div id="calcModal" class="calc-modal">
        <div class="calc-header">
            <div class="calc-title" id="calcPlayerName">Калькулятор</div>
            <div class="calc-close" onclick="closeCalc(false)">✕</div>
        </div>
        
        <div class="calc-total-area">
            <div class="calc-total-label">Итого очков</div>
            <div class="calc-total-value" id="calcTotalDisplay">0</div>
        </div>

        <div class="calc-grid">
            <div class="calc-btn" data-type="6" onclick="calcAddCard('6', 6)">
                <span class="calc-count" id="calc-count-6">0</span>
                <span class="calc-val">6</span>
                <span class="calc-desc">+6</span>
            </div>
            <div class="calc-btn" data-type="7" onclick="calcAddCard('7', 7)">
                <span class="calc-count" id="calc-count-7">0</span>
                <span class="calc-val">7</span>
                <span class="calc-desc">+7</span>
            </div>
            <div class="calc-btn" data-type="8" onclick="calcAddCard('8', 8)">
                <span class="calc-count" id="calc-count-8">0</span>
                <span class="calc-val">8</span>
                <span class="calc-desc">+8</span>
            </div>
            <div class="calc-btn" data-type="10" onclick="calcAddCard('10', 10)">
                <span class="calc-count" id="calc-count-10">0</span>
                <span class="calc-val">10</span>
                <span class="calc-desc">+10</span>
            </div>
            <div class="calc-btn" data-type="J" onclick="calcAddCard('J', 2)">
                <span class="calc-count" id="calc-count-J">0</span>
                <span class="calc-val">J</span>
                <span class="calc-desc">+2</span>
            </div>
            <div class="calc-btn calc-btn-q" id="calc-btn-q" data-type="Q" onclick="calcAddCard('Q', 3)">
                <span class="calc-count" id="calc-count-Q">0</span>
                <span class="calc-val">Q</span>
                <span class="calc-desc" id="calc-desc-Q">+3</span>
            </div>
            <div class="calc-btn calc-btn-qh" id="calc-btn-qh" data-type="QH" onclick="calcAddCard('QH', 3)">
                <span class="calc-count" id="calc-count-QH">0</span>
                <span class="calc-val">Q♥</span>
                <span class="calc-desc" id="calc-desc-QH">+3</span>
            </div>
            <div class="calc-btn" data-type="K" onclick="calcAddCard('K', 4)">
                <span class="calc-count" id="calc-count-K">0</span>
                <span class="calc-val">K</span>
                <span class="calc-desc">+4</span>
            </div>
            <div class="calc-btn" data-type="A" onclick="calcAddCard('A', 11)">
                <span class="calc-count" id="calc-count-A">0</span>
                <span class="calc-val">A</span>
                <span class="calc-desc">+11</span>
            </div>
        </div>

        <div class="calc-controls">
            <button class="calc-ctrl calc-reset" onclick="resetCalc()">Сброс</button>
            <button class="calc-ctrl calc-apply" onclick="applyCalcResult()">Применить</button>
        </div>
    </div>

    <script>
        // --- State & Storage Migration ---
        if (!localStorage.getItem('101_hist_v11') && localStorage.getItem('101_hist_v10')) {
            localStorage.setItem('101_hist_v11', localStorage.getItem('101_hist_v10'));
        }

        let players = JSON.parse(localStorage.getItem('101_v11')) || [];
        let gameCount = parseInt(localStorage.getItem('101_game_v11')) || 1;
        let roundCount = parseInt(localStorage.getItem('101_round_v11')) || 1;
        let history = JSON.parse(localStorage.getItem('101_hist_v11')) || {}; 
        
        let targetId = null;
        let isMinusMode = false;
        let currentStatTab = 'points';
        let selectedDate = new Date().toISOString().split('T')[0];

        // Calculator State
        let calcCards = [];
        let calcTargetPlayerId = null;
        const CALC_LIMITS = {
            '6': 4, '7': 4, '8': 4, '10': 4, 'J': 4, 'K': 4, 'A': 4,
            'Q': 3, 'QH': 1
        };

        function save() {
            localStorage.setItem('101_v11', JSON.stringify(players));
            localStorage.setItem('101_game_v11', gameCount);
            localStorage.setItem('101_round_v11', roundCount);
            localStorage.setItem('101_hist_v11', JSON.stringify(history));
            render();
        }

        function getToday() { return new Date().toISOString().split('T')[0]; }

        // --- Core Game Logic ---
        function addPlayer(name) {
            if(!name) return;
            if(players.some(p => p.name.toLowerCase() === name.toLowerCase())) {
                showToast(`⚠️ ${name} уже в игре`, true);
                hideAutocomplete();
                return;
            }
            players.push({id: Date.now(), name: name, score: 0});
            document.getElementById('nameInput').value = '';
            hideAutocomplete();
            save();
        }

        function addPlayerFromInput() {
            const inp = document.getElementById('nameInput');
            addPlayer(inp.value.trim());
        }

        // --- Autocomplete Logic ---
        const nameInput = document.getElementById('nameInput');
        const acList = document.getElementById('autocompleteList');

        nameInput.addEventListener('input', (e) => {
            const val = e.target.value.trim().toLowerCase();
            
            const allNames = new Set();
            if (history && typeof history === 'object') {
                Object.values(history).forEach(dayData => {
                    if (dayData && typeof dayData === 'object') {
                        Object.keys(dayData).forEach(name => allNames.add(name));
                    }
                });
            }
            players.forEach(p => allNames.add(p.name));

            if (!val) { hideAutocomplete(); return; }

            const matches = Array.from(allNames).filter(n => n.toLowerCase().includes(val));
            matches.sort((a, b) => {
                const aStarts = a.toLowerCase().startsWith(val);
                const bStarts = b.toLowerCase().startsWith(val);
                if (aStarts && !bStarts) return -1;
                if (!aStarts && bStarts) return 1;
                return a.localeCompare(b);
            });

            if (matches.length > 0) {
                acList.innerHTML = '';
                matches.forEach(name => {
                    const div = document.createElement('div');
                    div.className = 'autocomplete-item';
                    div.innerHTML = `<span class="ac-name">${name}</span>`;
                    div.onclick = () => addPlayer(name);
                    acList.appendChild(div);
                });
                acList.style.display = 'block';
            } else {
                hideAutocomplete();
            }
        });

        nameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addPlayerFromInput();
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.setup-area')) hideAutocomplete();
        });

        function hideAutocomplete() {
            acList.style.display = 'none';
        }

        function openModal(id, isMinus) {
            targetId = id; isMinusMode = isMinus; 
            const p = players.find(x => x.id === id);
            const title = document.getElementById('modalTitle');
            const input = document.getElementById('scoreInput');
            
            title.innerText = `${p.name} — ${isMinus ? 'ШТРАФ' : 'ОЧКИ'}`;
            title.style.color = isMinus ? 'var(--warn)' : 'var(--sub)';
            input.value = '';
            document.getElementById('scoreModal').style.display = 'flex';
            
            setTimeout(() => {
                input.focus();
                if (isMinus) input.value = '-';
            }, 100);
        }

        function closeModal() {
            document.getElementById('scoreModal').style.display = 'none';
            targetId = null;
        }

        function confirmScore() {
            const input = document.getElementById('scoreInput');
            let valStr = input.value;
            if(valStr === '-' || valStr === '' || valStr === null) { closeModal(); return; }
            let val = parseInt(valStr);
            if(isNaN(val)) { closeModal(); return; }

            if (isMinusMode && val > 0) val = -val;

            const p = players.find(x => x.id === targetId);
            if(!p) return;

            p.score += val;
            trackPoints(p.name, Math.abs(val));

            if (p.score >= 102) {
                showToast(`💀 ${p.name} перебрал! Новая игра`, true);
                players.forEach(pl => pl.score = 0);
                gameCount++;
                roundCount = 1;
            }

            closeModal();
            save();
        }

        function endRound() {
            // CHECK FOR EXACT 101 FIRST
            let bustPlayer = players.find(p => p.score === 101);
            
            if (bustPlayer) {
                showToast(`🎯 ${bustPlayer.name} набрал 101! Сброс`, true);
                players.forEach(pl => pl.score = 0);
                gameCount++;
                roundCount = 1;
                save();
                return; 
            }

            // DETERMINE WINNER
            let minScore = Infinity;
            let winners = [];
            
            players.forEach(p => {
                if (p.score > 0 && p.score < minScore) {
                    minScore = p.score;
                    winners = [p.name];
                } else if (p.score > 0 && p.score === minScore) {
                    winners.push(p.name);
                }
            });

            if (winners.length > 0) {
                winners.forEach(w => trackWin(w));
                showToast(`✅ Раунд завершен. Победитель: ${winners.join(', ')}`, false);
            } else {
                showToast(`✅ Раунд завершен`, false);
            }

            roundCount++;
            save();
        }

        function fullReset() {
            if(!confirm("Сбросить всю игру?")) return;
            players.forEach(p => p.score = 0);
            gameCount = 1; roundCount = 1;
            save();
        }

        function removePlayer(id) {
            if(confirm("Удалить игрока?")) {
                players = players.filter(x => x.id !== id);
                save();
            }
        }

        // --- Stats Logic ---
        function trackPoints(name, points) {
            const date = getToday();
            if (!history[date]) history[date] = {};
            if (!history[date][name]) history[date][name] = { points: 0, wins: 0 };
            history[date][name].points += points;
        }

        function trackWin(name) {
            const date = getToday();
            if (!history[date]) history[date] = {};
            if (!history[date][name]) history[date][name] = { points: 0, wins: 0 };
            history[date][name].wins += 1;
        }

        // --- FIXED STATS SHEET LOGIC ---
        const statsSheet = document.getElementById('statsSheet');
        const swipeArea = document.getElementById('swipeArea');
        const statsOverlay = document.getElementById('statsOverlay');
        let startY = 0, currentY = 0, isDragging = false;

        function openStats() {
            renderDates();
            renderStatsList();
            statsSheet.classList.add('open');
            statsOverlay.classList.add('visible');
            document.body.style.overflow = 'hidden';
        }

        function closeStats() {
            statsSheet.classList.remove('open');
            statsOverlay.classList.remove('visible');
            document.body.style.overflow = '';
            setTimeout(() => {
                statsSheet.style.transform = '';
            }, 300);
        }

        // Swipe Logic
        swipeArea.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
            isDragging = true;
            statsSheet.style.transition = 'none';
        }, { passive: true });

        swipeArea.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            currentY = e.touches[0].clientY;
            const diff = currentY - startY;
            
            if (diff > 0) {
                statsSheet.style.transform = `translateY(${diff}px)`;
                const opacity = Math.max(0, 0.5 - (diff / window.innerHeight));
                statsOverlay.style.opacity = opacity;
            }
        }, { passive: true });

        swipeArea.addEventListener('touchend', () => {
            if (!isDragging) return;
            isDragging = false;
            const diff = currentY - startY;
            
            statsSheet.style.transition = '';
            
            if (diff > 80) {
                closeStats();
            } else {
                statsSheet.style.transform = '';
                statsOverlay.style.opacity = '';
            }
            startY = 0; currentY = 0;
        });

        function switchTab(tab) {
            currentStatTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            renderStatsList();
        }

        function renderDates() {
            const container = document.getElementById('dateSelector');
            container.innerHTML = '';
            const dates = Object.keys(history).sort().reverse();
            if(dates.length === 0) dates.push(getToday()); 
            
            dates.forEach(d => {
                const chip = document.createElement('div');
                chip.className = `date-chip ${d === selectedDate ? 'active' : ''}`;
                const parts = d.split('-');
                chip.innerText = `${parts[2]}.${parts[1]}`;
                chip.onclick = () => { selectedDate = d; renderDates(); renderStatsList(); };
                container.appendChild(chip);
            });
        }

        function renderStatsList() {
            const list = document.getElementById('statsList');
            list.innerHTML = '';
            const data = history[selectedDate] || {};
            
            let sorted = Object.entries(data).map(([name, stats]) => ({
                name, 
                val: currentStatTab === 'points' ? stats.points : stats.wins
            })).sort((a,b) => b.val - a.val);

            if(sorted.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:var(--sub); margin-top:40px;">Нет данных за этот день</div>';
                return;
            }

            sorted.forEach((item, idx) => {
                const rankClass = idx === 0 ? 'top-1' : (idx === 1 ? 'top-2' : (idx === 2 ? 'top-3' : ''));
                const medal = idx === 0 ? '🥇' : (idx === 1 ? '🥈' : (idx === 2 ? '🥉' : (idx+1)));
                
                list.innerHTML += `
                    <div class="stat-row">
                        <div class="rank ${rankClass}">${medal}</div>
                        <div class="s-name">${item.name}</div>
                        <div class="s-val">${item.val}</div>
                    </div>
                `;
            });
        }

        // --- INTEGRATED CALCULATOR LOGIC ---
        const calcModal = document.getElementById('calcModal');
        const calcTotalDisplay = document.getElementById('calcTotalDisplay');
        const calcPlayerNameEl = document.getElementById('calcPlayerName');

        function openCalc(playerId) {
            calcTargetPlayerId = playerId;
            const p = players.find(x => x.id === playerId);
            calcPlayerNameEl.innerText = p ? p.name : 'Калькулятор';
            
            // Reset calculator state
            calcCards = [];
            calcRecalculate();
            
            calcModal.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeCalc(apply) {
            calcModal.classList.remove('open');
            document.body.style.overflow = '';
            if (!apply) {
                calcTargetPlayerId = null;
            }
        }

        function calcAddCard(type, baseValue) {
            // Check individual limit
            const currentCount = calcCards.filter(c => c.type === type).length;
            if (currentCount >= CALC_LIMITS[type]) {
                calcTriggerShake(type); return;
            }

            // Check combined Queen limit
            if (type === 'Q' || type === 'QH') {
                const qCount = calcCards.filter(c => c.type === 'Q').length;
                const qhCount = calcCards.filter(c => c.type === 'QH').length;
                if ((qCount + qhCount) >= 4) {
                    calcTriggerShake(type); return;
                }
            }

            calcCards.push({ type, baseValue });
            calcRecalculate();
            
            calcTotalDisplay.classList.add('bump');
            setTimeout(() => calcTotalDisplay.classList.remove('bump'), 100);
        }

        function calcTriggerShake(type) {
            const btn = document.querySelector(`.calc-btn[data-type="${type}"]`);
            if (btn) {
                btn.classList.add('shake');
                setTimeout(() => btn.classList.remove('shake'), 300);
            }
        }

        function resetCalc() {
            calcCards = [];
            calcRecalculate();
        }

        function applyCalcResult() {
            if (calcCards.length === 0 || !calcTargetPlayerId) {
                closeCalc(false);
                return;
            }

            const total = parseInt(calcTotalDisplay.innerText);
            const p = players.find(x => x.id === calcTargetPlayerId);
            
            if (p) {
                p.score += total;
                trackPoints(p.name, total);

                // Apply game rules after calculator result
                if (p.score >= 102) {
                    showToast(`💀 ${p.name} перебрал! Новая игра`, true);
                    players.forEach(pl => pl.score = 0);
                    gameCount++;
                    roundCount = 1;
                }
            }

            closeCalc(true);
            save();
        }

        function calcRecalculate() {
            const isSoloHand = calcCards.length === 1;
            let total = 0;
            const counts = {};

            calcCards.forEach(c => {
                counts[c.type] = (counts[c.type] || 0) + 1;
                let val = c.baseValue;
                if (isSoloHand) {
                    if (c.type === 'Q') val = 20;
                    if (c.type === 'QH') val = 40;
                }
                total += val;
            });

            calcTotalDisplay.innerText = total;

            // Update regular cards
            ['6','7','8','10','J','K','A'].forEach(t => calcUpdateCounter(t, counts[t]));
            
            // Update Queens
            const qCount = counts['Q'] || 0;
            const qhCount = counts['QH'] || 0;
            const totalQueens = qCount + qhCount;

            calcUpdateQueenUI('Q', qCount, totalQueens, isSoloHand, 'calc-btn-q', 'calc-desc-Q');
            calcUpdateQueenUI('QH', qhCount, totalQueens, isSoloHand, 'calc-btn-qh', 'calc-desc-QH');
        }

        function calcUpdateCounter(type, count) {
            const el = document.getElementById(`calc-count-${type}`);
            const btn = document.querySelector(`.calc-btn[data-type="${type}"]`);
            el.innerText = count || '';
            el.classList.toggle('visible', count > 0);
            btn.classList.toggle('disabled', count >= CALC_LIMITS[type]);
        }

        function calcUpdateQueenUI(type, count, totalQueens, isSoloHand, btnId, descId) {
            const el = document.getElementById(`calc-count-${type}`);
            const btn = document.getElementById(btnId);
            const desc = document.getElementById(descId);
            
            el.innerText = count || '';
            el.classList.toggle('visible', count > 0);
            
            const individualMaxed = count >= CALC_LIMITS[type];
            const combinedMaxed = totalQueens >= 4;
            btn.classList.toggle('disabled', individualMaxed || combinedMaxed);

            if (count > 0 && isSoloHand) {
                btn.classList.add('solo');
                const bonus = type === 'Q' ? 20 : 40;
                desc.innerText = `+${bonus} (Solo)`;
            } else {
                btn.classList.remove('solo');
                desc.innerText = '+3';
            }
        }

        // --- UI Helpers ---
        function showToast(msg, isError) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.className = isError ? 'toast show' : 'toast show success';
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        function render() {
            document.getElementById('gameNum').innerText = gameCount;
            document.getElementById('roundNum').innerText = roundCount;
            const area = document.getElementById('gameArea');
            area.innerHTML = '';

            players.sort((a,b) => {
                if (a.score > 0 && b.score === 0) return -1;
                if (a.score === 0 && b.score > 0) return 1;
                return b.score - a.score;
            });

            players.forEach(p => {
                const rem = p.score > 0 ? (101 - p.score) : '-';
                let remColor = 'color:var(--sub)';
                if (p.score > 90) remColor = 'color:var(--danger)';
                else if (p.score > 70) remColor = 'color:var(--warn)';
                else if (p.score > 0) remColor = 'color:var(--sub)';

                area.innerHTML += `
                    <div class="player-card">
                        <div class="p-info">
                            <div class="p-name">${p.name}</div>
                            <div class="p-stats">
                                <span class="score-val">${p.score}</span>
                                <span class="score-rem" style="${remColor}">(${rem})</span>
                            </div>
                        </div>
                        <div class="actions">
                            <button class="btn-action btn-minus" onclick="openModal(${p.id}, true)">−</button>
                            <button class="btn-action btn-plus" onclick="openModal(${p.id}, false)">+</button>
                            <button class="btn-action btn-calc" onclick="openCalc(${p.id})">🧮</button>
                            <button class="btn-action btn-del" onclick="removePlayer(${p.id})">×</button>
                        </div>
                    </div>`;
            });
        }

        render();
    </script>
</body>
</html>
