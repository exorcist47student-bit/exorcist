<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>101 Game Final</title>
    <style>
        :root {
            --bg: #000000; --card: #1c1c1e; --text: #ffffff; --sub: #8e8e93;
            --accent: #0a84ff; --danger: #ff453a; --success: #30d158; --warn: #ffd60a;
        }
        body { 
            background: var(--bg); color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            padding: 20px; margin: 0; padding-bottom: 100px;
        }
        
        /* Header Stats */
        .stats-bar { display: flex; justify-content: space-between; margin-bottom: 25px; gap: 10px; }
        .stat-box { 
            flex: 1; background: var(--card); padding: 10px; border-radius: 16px; 
            text-align: center; border: 1px solid #333; 
        }
        .stat-label { color: var(--sub); font-size: 11px; text-transform: uppercase; display: block; margin-bottom: 4px; letter-spacing: 0.5px; }
        .stat-val { font-size: 20px; font-weight: 700; }
        
        /* Setup */
        .setup-area { display: flex; gap: 10px; margin-bottom: 25px; }
        input[type="text"] { 
            flex: 1; background: var(--card); border: none; padding: 14px; 
            border-radius: 12px; color: white; font-size: 16px; outline: none; 
        }
        .btn-add { background: var(--accent); color: white; padding: 0 24px; border-radius: 12px; font-size: 20px; border:none; }

        /* Player Card */
        .player-card { 
            background: var(--card); padding: 16px; border-radius: 16px; 
            margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; 
        }
        .p-info { flex: 1; }
        .p-name { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
        .p-stats { display: flex; gap: 12px; align-items: baseline; }
        .score-val { color: var(--accent); font-weight: 800; font-size: 22px; }
        .score-rem { color: var(--sub); font-size: 15px; font-weight: 500; }
        
        /* Buttons */
        button { border: none; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.1s; -webkit-tap-highlight-color: transparent; }
        button:active { transform: scale(0.92); opacity: 0.8; }
        
        .actions { display: flex; gap: 8px; align-items: center; }
        .btn-action { width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; font-size: 24px; border-radius: 50%; }
        .btn-plus { background: var(--success); color: black; }
        .btn-minus { background: var(--warn); color: black; }
        .btn-del { background: transparent; color: var(--danger); font-size: 26px; width: 40px; }

        /* Modal */
        .modal-overlay { 
            position: fixed; top:0; left:0; right:0; bottom:0; 
            background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; 
            z-index: 100; backdrop-filter: blur(8px); 
        }
        .modal { 
            background: #2c2c2e; padding: 30px 25px; border-radius: 24px; 
            width: 85%; max-width: 340px; text-align: center; 
        }
        .modal h3 { margin: 0 0 15px 0; color: var(--sub); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        
        .modal input { 
            width: 100%; margin: 10px 0 25px 0; text-align: center; 
            font-size: 48px; font-weight: bold; background: #1c1c1e; 
            border: 1px solid #48484a; border-radius: 16px; padding: 15px 0;
            color: white; outline: none; -moz-appearance: textfield;
        }
        .modal input::-webkit-outer-spin-button, .modal input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        .modal-btns { display: flex; gap: 12px; justify-content: center; }
        .modal-btns button { flex: 1; padding: 16px; font-size: 17px; border-radius: 14px; }
        .btn-cancel { background: #3a3a3c; color: white; }
        .btn-ok { background: var(--accent); color: white; }

        /* Toast */
        .toast { 
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px); 
            background: var(--danger); color: white; padding: 14px 28px; border-radius: 30px; 
            font-weight: 700; box-shadow: 0 5px 15px rgba(255,69,58,0.4); 
            opacity: 0; transition: 0.3s; pointer-events: none; z-index: 200; white-space: nowrap; 
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* Bottom Control Panel */
        .bottom-panel { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: rgba(28,28,30,0.95); backdrop-filter: blur(15px); 
            padding: 15px 20px 35px 20px; display: flex; gap: 12px; 
            border-top: 1px solid #333; z-index: 50; 
        }
        .btn-round { 
            flex: 2; background: var(--accent); color: white; 
            padding: 16px; font-size: 17px; border-radius: 14px; 
        }
        .btn-reset { 
            flex: 1; background: #2c2c2e; color: var(--danger); 
            padding: 16px; border-radius: 14px; border: 1px solid #3a3a3c; 
        }
    </style>
</head>
<body>

    <div class="stats-bar">
        <div class="stat-box">
            <span class="stat-label">Игра</span>
            <span class="stat-val" id="gameNum">1</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">Раунд</span>
            <span class="stat-val" id="roundNum">1</span>
        </div>
    </div>

    <div class="setup-area">
        <input type="text" id="nameInput" placeholder="Имя игрока..." onkeypress="if(event.key==='Enter') addPlayer()">
        <button class="btn-add" onclick="addPlayer()">+</button>
    </div>

    <div id="gameArea"></div>

    <!-- Modal for Input -->
    <div id="scoreModal" class="modal-overlay">
        <div class="modal">
            <h3 id="modalTitle">Очки</h3>
            <input type="number" id="scoreInput" inputmode="decimal">
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModal()">Отмена</button>
                <button class="btn-ok" onclick="confirmScore()">OK</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">🔥 Перебор! Новая игра</div>
    
    <!-- Bottom Controls -->
    <div class="bottom-panel">
        <button class="btn-reset" onclick="fullReset()">Сброс</button>
        <button class="btn-round" onclick="endRound()">Завершить раунд</button>
    </div>

    <script>
        let players = JSON.parse(localStorage.getItem('101_v8')) || [];
        let gameCount = parseInt(localStorage.getItem('101_game_v8')) || 1;
        let roundCount = parseInt(localStorage.getItem('101_round_v8')) || 1;
        let targetId = null;
        let isMinusMode = false;

        function save() {
            localStorage.setItem('101_v8', JSON.stringify(players));
            localStorage.setItem('101_game_v8', gameCount);
            localStorage.setItem('101_round_v8', roundCount);
            render();
        }

        function addPlayer() {
            const inp = document.getElementById('nameInput');
            const name = inp.value.trim();
            if(name) {
                players.push({id: Date.now(), name: name, score: 0});
                inp.value = '';
                save();
            }
        }

        function openModal(id, isMinus) {
            targetId = id;
            isMinusMode = isMinus; 
            
            const p = players.find(x => x.id === id);
            const title = document.getElementById('modalTitle');
            const input = document.getElementById('scoreInput');
            
            title.innerText = `${p.name} — ${isMinus ? 'ШТРАФ' : 'ОЧКИ'}`;
            title.style.color = isMinus ? 'var(--warn)' : 'var(--sub)';
            
            input.value = '';
            document.getElementById('scoreModal').style.display = 'flex';
            
            setTimeout(() => {
                input.focus();
                if (isMinus) input.value = '-';
            }, 100);
        }

        function closeModal() {
            document.getElementById('scoreModal').style.display = 'none';
            targetId = null;
        }

        function confirmScore() {
            const input = document.getElementById('scoreInput');
            let valStr = input.value;
            
            if(valStr === '-' || valStr === '' || valStr === null) { closeModal(); return; }
            
            let val = parseInt(valStr);
            if(isNaN(val)) { closeModal(); return; }

            // SAFETY: Force negative if opened via Minus button
            if (isMinusMode && val > 0) {
                val = -val;
            }

            const p = players.find(x => x.id === targetId);
            if(!p) return;

            p.score += val;

            // Rule: >= 102 triggers FULL RESET (New Game)
            if (p.score >= 102) {
                showToast(`💀 ${p.name} перебрал (${p.score})`);
                
                // Reset everyone's current score
                players.forEach(pl => pl.score = 0);
                
                // Increment Game, Reset Round to 1
                gameCount++;
                roundCount = 1;
            }

            closeModal();
            save();
        }

        // Manual Round End
        function endRound() {
            if(!confirm("Раунд завершен? Переходим к следующему.")) return;
            roundCount++;
            save();
        }

        function fullReset() {
            if(!confirm("Сбросить всю игру полностью?")) return;
            players.forEach(p => p.score = 0);
            gameCount = 1;
            roundCount = 1;
            save();
        }

        function removePlayer(id) {
            if(confirm("Удалить игрока?")) {
                players = players.filter(x => x.id !== id);
                save();
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function render() {
            document.getElementById('gameNum').innerText = gameCount;
            document.getElementById('roundNum').innerText = roundCount;
            
            const area = document.getElementById('gameArea');
            area.innerHTML = '';

            // Sort: Active players first, then by score desc
            players.sort((a,b) => {
                if (a.score > 0 && b.score === 0) return -1;
                if (a.score === 0 && b.score > 0) return 1;
                return b.score - a.score;
            });

            players.forEach(p => {
                const rem = p.score > 0 ? (101 - p.score) : '-';
                let remColor = 'color:var(--sub)';
                if (p.score > 90) remColor = 'color:var(--danger)';
                else if (p.score > 70) remColor = 'color:var(--warn)';
                else if (p.score > 0) remColor = 'color:#636366';

                area.innerHTML += `
                    <div class="player-card">
                        <div class="p-info">
                            <div class="p-name">${p.name}</div>
                            <div class="p-stats">
                                <span class="score-val">${p.score}</span>
                                <span class="score-rem" style="${remColor}">(${rem})</span>
                            </div>
                        </div>
                        <div class="actions">
                            <button class="btn-action btn-minus" onclick="openModal(${p.id}, true)">−</button>
                            <button class="btn-action btn-plus" onclick="openModal(${p.id}, false)">+</button>
                            <button class="btn-action btn-del" onclick="removePlayer(${p.id})">×</button>
                        </div>
                    </div>`;
            });
        }

        render();
    </script>
</body>
</html>
