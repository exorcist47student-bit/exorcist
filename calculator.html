<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>101 Calculator</title>
    <style>
        :root {
            --bg: #000000; --card: #1c1c1e; --text: #ffffff; --sub: #8e8e93;
            --accent: #0a84ff; --danger: #ff453a; --success: #30d158; 
            --warn: #ffd60a; --heart: #ff375f; --border: #333333;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f2f2f7; --card: #ffffff; --text: #000000; --sub: #636366;
                --accent: #007aff; --danger: #ff3b30; --success: #34c759; 
                --warn: #ffcc00; --heart: #ff2d55; --border: #e5e5ea;
            }
        }

        body { 
            background: var(--bg); color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; 
            margin: 0; padding: 20px; height: 100vh; box-sizing: border-box;
            display: flex; flex-direction: column; transition: background 0.3s;
        }

        .header { text-align: center; margin-bottom: 30px; }
        .total-label { font-size: 14px; color: var(--sub); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .total-value { font-size: 72px; font-weight: 800; line-height: 1; transition: transform 0.1s; }
        .total-value.bump { transform: scale(1.1); }

        .grid { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; 
            flex: 1; align-content: start; max-width: 500px; margin: 0 auto; width: 100%;
        }

        .btn-card {
            background: var(--card); border: 1px solid var(--border); border-radius: 16px;
            height: 90px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.1s; position: relative; overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-card:active { transform: scale(0.95); background: var(--border); }
        .btn-card.disabled { opacity: 0.4; pointer-events: none; }
        .btn-card.shake { animation: shake 0.3s ease-in-out; }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        .card-val { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
        .card-desc { font-size: 12px; color: var(--sub); }
        .card-count { 
            position: absolute; top: 8px; right: 10px; 
            font-size: 12px; font-weight: 600; color: var(--sub); opacity: 0;
            transition: opacity 0.2s;
        }
        .card-count.visible { opacity: 1; }
        
        /* Special Styles for Queens */
        .btn-q.solo .card-count { color: var(--warn); opacity: 1; }
        .btn-qh.solo .card-count { color: var(--heart); opacity: 1; }
        .btn-qh .card-val { color: var(--heart); }

        .controls { 
            display: flex; gap: 12px; margin-top: auto; padding-top: 20px; 
            max-width: 500px; width: 100%; margin-left: auto; margin-right: auto;
        }
        .btn-ctrl { 
            flex: 1; padding: 18px; border-radius: 16px; border: none; 
            font-size: 18px; font-weight: 600; cursor: pointer; 
            -webkit-tap-highlight-color: transparent;
        }
        .btn-reset { background: var(--card); color: var(--danger); border: 1px solid var(--border); }
        .btn-done { background: var(--accent); color: white; }
    </style>
</head>
<body>

    <div class="header">
        <div class="total-label">Итого очков</div>
        <div class="total-value" id="totalDisplay">0</div>
    </div>

    <div class="grid">
        <!-- Row 1 -->
        <div class="btn-card" data-type="6" onclick="addCard('6', 6)">
            <span class="card-count" id="count-6">0</span>
            <span class="card-val">6</span>
            <span class="card-desc">+6</span>
        </div>
        <div class="btn-card" data-type="7" onclick="addCard('7', 7)">
            <span class="card-count" id="count-7">0</span>
            <span class="card-val">7</span>
            <span class="card-desc">+7</span>
        </div>
        <div class="btn-card" data-type="8" onclick="addCard('8', 8)">
            <span class="card-count" id="count-8">0</span>
            <span class="card-val">8</span>
            <span class="card-desc">+8</span>
        </div>

        <!-- Row 2 -->
        <div class="btn-card" data-type="10" onclick="addCard('10', 10)">
            <span class="card-count" id="count-10">0</span>
            <span class="card-val">10</span>
            <span class="card-desc">+10</span>
        </div>
        <div class="btn-card" data-type="J" onclick="addCard('J', 2)">
            <span class="card-count" id="count-J">0</span>
            <span class="card-val">J</span>
            <span class="card-desc">+2</span>
        </div>
        <div class="btn-card btn-q" id="btn-q" data-type="Q" onclick="addCard('Q', 3)">
            <span class="card-count" id="count-Q">0</span>
            <span class="card-val">Q</span>
            <span class="card-desc" id="desc-Q">+3</span>
        </div>

        <!-- Row 3 -->
        <div class="btn-card btn-qh" id="btn-qh" data-type="QH" onclick="addCard('QH', 3)">
            <span class="card-count" id="count-QH">0</span>
            <span class="card-val">Q♥</span>
            <span class="card-desc" id="desc-QH">+3</span>
        </div>
        <div class="btn-card" data-type="K" onclick="addCard('K', 4)">
            <span class="card-count" id="count-K">0</span>
            <span class="card-val">K</span>
            <span class="card-desc">+4</span>
        </div>
        <div class="btn-card" data-type="A" onclick="addCard('A', 11)">
            <span class="card-count" id="count-A">0</span>
            <span class="card-val">A</span>
            <span class="card-desc">+11</span>
        </div>
    </div>

    <div class="controls">
        <button class="btn-ctrl btn-reset" onclick="resetCalc()">Сброс</button>
        <button class="btn-ctrl btn-done" onclick="window.close()">Готово</button>
    </div>

    <script>
        // State: array of card objects
        let cards = [];
        const MAX_CARDS_PER_TYPE = 4;

        function addCard(type, baseValue) {
            // Check limit
            const currentCount = cards.filter(c => c.type === type).length;
            if (currentCount >= MAX_CARDS_PER_TYPE) {
                // Visual feedback for limit reached
                const btn = document.querySelector(`.btn-card[data-type="${type}"]`);
                if (btn) {
                    btn.classList.add('shake');
                    setTimeout(() => btn.classList.remove('shake'), 300);
                }
                return;
            }

            cards.push({ type, baseValue });
            recalculate();
            
            // Visual bump effect on total
            const totalEl = document.getElementById('totalDisplay');
            totalEl.classList.add('bump');
            setTimeout(() => totalEl.classList.remove('bump'), 100);
        }

        function resetCalc() {
            if(cards.length === 0) return;
            cards = [];
            recalculate();
        }

        // API for integration with main game
        function getIntegratedResult() {
            return {
                total: parseInt(document.getElementById('totalDisplay').innerText),
                cards: [...cards], // Return copy to prevent external mutation
                timestamp: Date.now()
            };
        }

        function recalculate() {
            // FIXED LOGIC: Solo bonus applies ONLY if total cards == 1
            const isSoloHand = cards.length === 1;
            
            let total = 0;
            const counts = {};

            // First pass: count everything and calculate base total
            cards.forEach(c => {
                counts[c.type] = (counts[c.type] || 0) + 1;
                
                let val = c.baseValue;
                
                // Apply Solo Bonus only if hand has exactly 1 card
                if (isSoloHand) {
                    if (c.type === 'Q') val = 20;
                    if (c.type === 'QH') val = 40;
                }
                
                total += val;
            });

            // Update UI
            document.getElementById('totalDisplay').innerText = total;

            // Update counters and button states
            ['6','7','8','10','J','K','A'].forEach(t => updateCounter(t, counts[t]));
            
            // Special handling for Queens to show solo status
            updateQueenUI('Q', counts['Q'], isSoloHand, 'btn-q', 'desc-Q');
            updateQueenUI('QH', counts['QH'], isSoloHand, 'btn-qh', 'desc-QH');
        }

        function updateCounter(type, count) {
            const el = document.getElementById(`count-${type}`);
            const btn = document.querySelector(`.btn-card[data-type="${type}"]`);
            
            el.innerText = count || '';
            el.classList.toggle('visible', count > 0);
            
            // Disable button if limit reached
            if (count >= MAX_CARDS_PER_TYPE) {
                btn.classList.add('disabled');
            } else {
                btn.classList.remove('disabled');
            }
        }

        function updateQueenUI(type, count, isSoloHand, btnId, descId) {
            const el = document.getElementById(`count-${type}`);
            const btn = document.getElementById(btnId);
            const desc = document.getElementById(descId);
            
            el.innerText = count || '';
            el.classList.toggle('visible', count > 0);
            
            // Highlight only if this queen type exists AND hand is solo
            const hasThisQueen = count > 0;
            if (hasThisQueen && isSoloHand) {
                btn.classList.add('solo');
                const bonus = type === 'Q' ? 20 : 40;
                desc.innerText = `+${bonus} (Solo)`;
            } else {
                btn.classList.remove('solo');
                desc.innerText = '+3';
            }
            
            // Also handle disabled state for queens
            if (count >= MAX_CARDS_PER_TYPE) {
                btn.classList.add('disabled');
            } else {
                btn.classList.remove('disabled');
            }
        }

        // Initialize
        recalculate();
    </script>
</body>
</html>
